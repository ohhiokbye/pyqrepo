name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpyq_notes_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cpyq_notes_validation
      CPYQ_INTEGRATION: "1"
      AUTH_SECRET: ci-fixture-session-secret-at-least-32-characters
      WORKER_INTERNAL_KEY: ci-fixture-worker-key
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to isolated database
        run: npx prisma migrate deploy

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and database integration tests
        run: npm test

      - name: Production build
        run: npm run build -- --webpack

      - name: Dependency advisory audit
        run: npm audit --audit-level=low

      - name: Check candidate files for secrets
        working-directory: .
        run: python3 scripts/check-secrets.py

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            worker/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Compile worker sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Dependency advisory audit
        run: python -m pip_audit
