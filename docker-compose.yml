services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-p", "5433", "-c", "listen_addresses=127.0.0.1,localhost"]
    environment:
      POSTGRES_USER: cpyq_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpyq_password}
      POSTGRES_DB: cpyq
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
